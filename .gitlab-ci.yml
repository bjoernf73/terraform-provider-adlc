stages:
  - build
  - test
  - e2e

variables:
  GO_IMAGE: "golang:1.25"
  TF_IMAGE: "hashicorp/terraform:1.13"
  PROVIDER_NAMESPACE: "henrikhalt"
  PROVIDER_TYPE: "dryad"
  PROVIDER_VERSION: "0.0.0-ci"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOTOOLCHAIN: "local"

.go_cache: &go_cache
  key:
    files:
      - go.sum
  paths:
    - .go/pkg/mod

build:
  stage: build
  image: $GO_IMAGE
  tags:
    - kubernetes
  cache: *go_cache
  script:
    - test -z "$(gofmt -l main.go internal)" || { echo 'gofmt issues:'; gofmt -l main.go internal; exit 1; }
    - go vet ./...
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/terraform-provider-dryad_v${PROVIDER_VERSION} .
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

unit:
  stage: test
  image: $GO_IMAGE
  tags:
    - kubernetes
  cache: *go_cache
  script:
    - go test ./...

.e2e_template:
  stage: e2e
  image:
    name: $TF_IMAGE
    entrypoint: [""]
  tags:
    - kubernetes
  needs:
    - job: build
      artifacts: true
  variables:
    TF_IN_AUTOMATION: "1"
    TF_INPUT: "0"
    TF_CLI_CONFIG_FILE: "$CI_PROJECT_DIR/.ci.tfrc"
    TF_VAR_host: "$DRYAD_HOST"
  before_script:
    - MIRROR="$CI_PROJECT_DIR/.provider-mirror/registry.terraform.io/${PROVIDER_NAMESPACE}/${PROVIDER_TYPE}/${PROVIDER_VERSION}/linux_amd64"
    - mkdir -p "$MIRROR"
    - install -m 0755 "dist/terraform-provider-dryad_v${PROVIDER_VERSION}" "$MIRROR/terraform-provider-dryad_v${PROVIDER_VERSION}"
    - |
      cat > "$TF_CLI_CONFIG_FILE" <<EOF
      provider_installation {
        filesystem_mirror {
          path    = "$CI_PROJECT_DIR/.provider-mirror"
          include = ["registry.terraform.io/${PROVIDER_NAMESPACE}/${PROVIDER_TYPE}"]
        }
        direct {
          exclude = ["registry.terraform.io/${PROVIDER_NAMESPACE}/${PROVIDER_TYPE}"]
        }
      }
      EOF
  script:
    - cd test/e2e
    - terraform fmt -check -recursive
    - terraform init -no-color
    - terraform validate -no-color
    - terraform apply -auto-approve -no-color
    # Update path: change a reconcilable attribute and re-apply.
    - TF_VAR_ou_description="updated by pipeline ${CI_PIPELINE_ID}" terraform apply -auto-approve -no-color
    # Idempotency: a second plan must produce no changes (exit code 0).
    - TF_VAR_ou_description="updated by pipeline ${CI_PIPELINE_ID}" terraform plan -detailed-exitcode -no-color
  after_script:
    - cd test/e2e && terraform destroy -auto-approve -no-color || true

e2e:winrm:
  extends: .e2e_template
  variables:
    TF_VAR_transport: "winrm"
    TF_VAR_username: "$DRYAD_USERNAME"
    TF_VAR_password: "$DRYAD_PASSWORD"
    TF_VAR_ou_path: "TerraformCI/pipeline-$CI_PIPELINE_ID-winrm"
    TF_VAR_group_name: "dryad-ci-$CI_PIPELINE_ID-winrm"
  rules:
    # Required CI/CD variables: DRYAD_HOST, DRYAD_USERNAME, DRYAD_PASSWORD (masked).
    # Optional overrides are set directly as TF_VAR_port / TF_VAR_winrm_auth /
    # TF_VAR_winrm_use_tls / TF_VAR_insecure CI/CD variables.
    - if: '$DRYAD_HOST == null || $DRYAD_HOST == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true

e2e:ssh:
  extends: .e2e_template
  variables:
    TF_VAR_transport: "ssh"
    TF_VAR_username: "$DRYAD_USERNAME"
    TF_VAR_password: "$DRYAD_PASSWORD"
    TF_VAR_ou_path: "TerraformCI/pipeline-$CI_PIPELINE_ID-ssh"
    TF_VAR_group_name: "dryad-ci-$CI_PIPELINE_ID-ssh"    # No known_hosts entry for the target, so host key verification is disabled here.
    # Set ssh_known_hosts_path or ssh_host_key to turn it back on.
    TF_VAR_insecure: "true"  rules:
    # Requires DRYAD_SSH_USERNAME and DRYAD_SSH_PASSWORD (masked) in addition to DRYAD_HOST.
    - if: '$DRYAD_HOST == null || $DRYAD_HOST == ""'
      when: never
    - if: '$DRYAD_PASSWORD == null || $DRYAD_PASSWORD == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true

# Applies a fixed-name configuration over WinRM/HTTPS with every property populated, and
# deliberately leaves the objects in place so they can be inspected in ADUC. The state is
# discarded with the job; the next run reconciles the same objects rather than creating
# new ones, because every ensure script is idempotent.
e2e:winrm-https:
  extends: .e2e_template
  variables:
    TF_VAR_username: "$DRYAD_USERNAME"
    TF_VAR_password: "$DRYAD_PASSWORD"
  rules:
    # Requires an HTTPS listener on 5986; opt in with DRYAD_WINRM_HTTPS=true.
    # Certificate validation is on by default: set TF_VAR_insecure=true if the
    # listener uses a self-signed certificate.
    - if: '$DRYAD_HOST == null || $DRYAD_HOST == ""'
      when: never
    - if: '$DRYAD_WINRM_HTTPS != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true
  script:
    - cd test/showcase
    - terraform fmt -check -recursive
    - terraform init -no-color
    - terraform validate -no-color
    - terraform apply -auto-approve -no-color
    # Idempotency: re-applying the same configuration must produce no changes.
    - terraform plan -detailed-exitcode -no-color
    - terraform output -json | tee "$CI_PROJECT_DIR/showcase-outputs.json"
  after_script:
    - echo "Showcase objects left in place for inspection."
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - showcase-outputs.json
